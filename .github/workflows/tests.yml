name: Validate ETL and Airflow DAG

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Airflow and project dependencies
        run: >-
          python -m pip install
          apache-airflow==3.3.2 apache-airflow-providers-standard
          -r requirements.txt pytest
      - name: Run data-contract and actual DAG import tests
        env:
          AIRFLOW__CORE__LOAD_EXAMPLES: "false"
        run: python -m pytest -q
